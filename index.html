                }

                list.forEach(station => results.appendChild(stationCard(station)));
            }

            function toggleFavorite(station) {
                const id = makeId(station);
                if (isFavorite(station)) {
                    favorites = favorites.filter(f => f.id !== id);
                } else {
                    favorites.push(normalizeStation(station));
                }
                saveFavorites();
            }

            function exportFavoritesFile() {
                if (!favorites.length) {
                    showToast('No tienes ningún favorito para exportar.');
                    return;
                }
                const blob = new Blob([JSON.stringify(favorites, null, 2)], { type: 'application/json' });
                const blobUrl = URL.createObjectURL(blob);
                const downloadAnchor = document.createElement('a');
                downloadAnchor.href = blobUrl;
                downloadAnchor.download = 'mis_emisoras_favoritas.json';
                downloadAnchor.style.display = 'none';
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
            }

            fileInput.addEventListener('change', event => {
                const file = event.target.files[0];
                fileInput.value = ''; // permite volver a elegir el mismo archivo
                if (!file) return;

                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const imported = sanitizeFavorites(JSON.parse(e.target.result));
                        if (imported.length > 0) {
                            // Fusionar: se conservan las actuales y solo se añaden las nuevas (sin duplicados)
                            const before = favorites.length;
                            favorites = sanitizeFavorites([...favorites, ...imported]);
                            const added = favorites.length - before;
                            saveFavorites();
                            showToast(added > 0
                                ? `¡Listo! Se han añadido ${added} emisoras nuevas. Ahora tienes ${favorites.length} favoritas.`
                                : 'No había emisoras nuevas: ya tenías todas las del archivo.');
                            if (currentMode === 'favorites') renderFavorites();
                        } else {
                            showToast('El archivo JSON no contiene una lista válida de emisoras.');
                        }
                    } catch (_) {
                        showToast('Error al leer el archivo. Asegúrate de que sea un JSON válido.');
                    }
                };
                reader.onerror = () => showToast('No se pudo leer el archivo.');
                reader.readAsText(file);
            });

            async function playStation(station) {
                userPaused = false;
                const normalized = normalizeStation(station);
                playingStation = normalized;
                shareBtn.hidden = false;
                updateMediaSession(normalized);
                miniName.textContent = normalized.name;
                miniStatus.textContent = 'Conectando…';
                playPauseBtn.textContent = 'Ⅱ';

                if (loadedUrl !== normalized.url || !audio.src) {
                    if (!audio.paused) switchingStation = true; // el 'pause' que sigue es un cambio de emisora, no una pausa real
                    audio.pause();
                    resetNowPlaying();
                    corsRetryPending = false;
                    configureCors(normalized.url);
                    audio.src = normalized.url;
                    loadedUrl = normalized.url;
                    audio.load();
                }

                try {
                    await audio.play();
                } catch (err) {
                    // AbortError = se ha elegido otra emisora mientras esta cargaba: no es un fallo
                    if (corsRetryPending || err?.name === 'AbortError' || playingStation !== normalized) return;
                    miniStatus.textContent = 'No se pudo reproducir. Prueba otra emisora.';
                    playPauseBtn.textContent = '▶';
                }

                refreshPlayButtons();
            }

            function refreshPlayButtons() {
                document.querySelectorAll('[data-play]').forEach(button => {
                    const btnId = button.getAttribute('data-play');
                    const active = playingStation && playingStation.id === btnId;
                    button.textContent = active && !audio.paused ? 'Ⅱ' : '▶';
                    button.closest('.rmw-station')?.classList.toggle('rmw-playing', Boolean(active));
                });
            }

            shareBtn.addEventListener('click', async () => {
                const station = playingStation;
                if (!station) return;
                // Enlace a la radio con la emisora dentro. Con identificador estándar basta ese; si no lo tiene
                // (por ejemplo, favoritos antiguos), el enlace lleva el stream, el nombre y el país
                const shareUrl = UUID_RE.test(station.id)
                    ? `${SHARE_BASE_URL}?emisora=${encodeURIComponent(station.id)}`
                    : `${SHARE_BASE_URL}?stream=${encodeURIComponent(station.url)}&nombre=${encodeURIComponent(station.name)}&pais=${encodeURIComponent(station.country || '')}`;
                const shareData = {
                    title: station.name,
                    text: [station.name, station.country].filter(Boolean).join(' · ') + ' — Radio Forocochera',
                    url: shareUrl
                };
                try {
                    if (navigator.share) {
                        await navigator.share(shareData);
                    } else if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(shareData.text + '\n' + shareData.url);
                        showToast('Enlace de la emisora copiado');
                    }
                } catch (_) { /* el usuario cerró el menú de compartir */ }
            });

            playPauseBtn.addEventListener('click', async () => {
                if (!audio.src) return;
                if (audio.paused) {
                    userPaused = false;
                    try { await audio.play(); } catch (_) { miniStatus.textContent = 'No se pudo reanudar la emisora.'; }
                } else {
                    userPaused = true;
                    audio.pause();
                }
            });

            const volRange = document.getElementById('rmw-volume');
            volRange.value = String(audio.volume);
            volRange.addEventListener('input', event => {
                audio.volume = Number(event.target.value);
                store.set(STORAGE.volume, String(audio.volume));
            });

            async function tryAutoResume() {
                if (userPaused) { disarmAutoResume(); return; }
                if (!audio.paused || !audio.src) return;
                try {
                    await audio.play();
                    disarmAutoResume();
                } catch (_) {}
            }

            function onVisibilityResume() {
                if (document.visibilityState === 'visible') tryAutoResume();
            }

            function armAutoResume() {
                if (autoResumeArmed) return;
                autoResumeArmed = true;
                window.addEventListener('focus', tryAutoResume);
                window.addEventListener('click', tryAutoResume);
                document.addEventListener('visibilitychange', onVisibilityResume);
            }

            function disarmAutoResume() {
                if (!autoResumeArmed) return;
                autoResumeArmed = false;
                window.removeEventListener('focus', tryAutoResume);
                window.removeEventListener('click', tryAutoResume);
                document.removeEventListener('visibilitychange', onVisibilityResume);
            }

            // Ecualizador Dinámico y Real
            const visualizerBars = document.querySelectorAll('.rmw-bar');
            const corsBlockedHosts = new Set();
            const SIGNAL_GRACE_MS = 5000;
            let visualizerTimer = null;
            let visualizerFrame = 0;
            let corsRetryPending = false;
            let corsRetryHost = '';
            let analyserCtx = null;
            let analyser = null;
            let analyserSource = null;
            let analyserUrl = '';
            let freqData = null;
            let realAudio = false;
            let lastSignalAt = 0;
            const bandMax = [0, 0, 0];
            const bandMin = [255, 255, 255];
            const barLevels = [0, 0, 0];

            function hostOf(url) {
                try { return new URL(url).host; } catch (_) { return ''; }
            }

            function configureCors(url) {
                const canCapture = typeof audio.captureStream === 'function' || typeof audio.mozCaptureStream === 'function';
                if (canCapture && !corsBlockedHosts.has(hostOf(url))) audio.crossOrigin = 'anonymous';
                else audio.removeAttribute('crossorigin');
            }

            function setupRealAnalyser() {
                if (realAudio && analyserUrl === loadedUrl) return;
                realAudio = false;
                if (!audio.crossOrigin) return;
                try {
                    const capture = audio.captureStream || audio.mozCaptureStream;
                    const stream = capture.call(audio);
                    if (!stream.getAudioTracks().length) return;
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;
                    if (!analyserCtx) analyserCtx = new AudioCtx();
                    if (analyserCtx.state === 'suspended') analyserCtx.resume().catch(() => {});
                    if (!analyser) {
                        analyser = analyserCtx.createAnalyser();
                        analyser.fftSize = 1024;
                        analyser.smoothingTimeConstant = 0.35;
                        analyser.minDecibels = -90;
                        analyser.maxDecibels = -20;
                        freqData = new Uint8Array(analyser.frequencyBinCount);
                    }
                    if (analyserSource) analyserSource.disconnect();
                    analyserSource = analyserCtx.createMediaStreamSource(stream);
                    analyserSource.connect(analyser);
                    analyserUrl = loadedUrl;
                    for (let i = 0; i < 3; i++) { bandMax[i] = 0; bandMin[i] = 255; barLevels[i] = 0; }
                    lastSignalAt = Date.now();
                    realAudio = true;
                } catch (_) {
                    realAudio = false;
                }
            }

            function bandLevel(from, to) {
                let sum = 0;
                let peak = 0;
                for (let i = from; i <= to; i++) {
                    sum += freqData[i];
                    if (freqData[i] > peak) peak = freqData[i];
                }
                return (sum / (to - from + 1)) * 0.5 + peak * 0.5;
            }

            function normalizeLevel(i, raw) {
                bandMax[i] = Math.max(raw, bandMax[i] * 0.995);
                bandMin[i] = raw < bandMin[i] ? raw : bandMin[i] + (raw - bandMin[i]) * 0.01;
                const span = Math.max(20, bandMax[i] - bandMin[i]);
                return Math.min(1, Math.max(0, (raw - bandMin[i]) / span));
            }

            function setBarHeights(rawLevels) {
                visualizerBars.forEach((bar, i) => {
                    const level = Math.pow(normalizeLevel(i, rawLevels[i]), 1.5);
                    barLevels[i] = Math.max(level, barLevels[i] * 0.7);
                    bar.style.height = Math.round(4 + barLevels[i] * 15) + 'px';
                });
            }

            function resetBars() {
                for (let i = 0; i < 3; i++) barLevels[i] = 0;
                visualizerBars.forEach(bar => {
                    if (bar.style.height !== '4px') bar.style.height = '4px';
                });
            }

            function visualizerTick() {
                if (audio.paused || !miniPlayer.classList.contains('is-playing')) {
                    resetBars();
                    return;
                }
                visualizerFrame++;

                if (realAudio && analyser) {
                    analyser.getByteFrequencyData(freqData);
                    const levels = [
                        bandLevel(1, 5),     // graves
                        bandLevel(6, 40),    // medios
                        bandLevel(41, 200)   // agudos
                    ];
                    if (levels[0] + levels[1] + levels[2] > 0) {
                        lastSignalAt = Date.now();
                    }
                    if (Date.now() - lastSignalAt < SIGNAL_GRACE_MS) {
                        setBarHeights(levels);
                        return;
                    }
                }

                if (visualizerFrame % 3) return;
                visualizerBars.forEach(bar => {
                    bar.style.height = (Math.floor(Math.random() * 15) + 4) + 'px';
                });
            }

            function startDynamicVisualizer() {
                if (visualizerTimer) return;
                visualizerTimer = setInterval(visualizerTick, 40);
            }

            function stopDynamicVisualizer() {
                clearInterval(visualizerTimer);
                visualizerTimer = null;
                resetBars();
            }

            // ---------------------- CANCIÓN QUE ESTÁ SONANDO (metadatos ICY) ----------------------
            // Se abre una segunda conexión corta a la emisora pidiendo los metadatos.
            // Solo funciona si el servidor de la emisora lo permite (CORS); si no, no se muestra nada.
            const NOW_PLAYING_INTERVAL_MS = 10000;
            const NOW_PLAYING_MAX_FAILURES = 2;
            const ICY_PROXY_URL = 'https://radio-titulos.ivanete8888.workers.dev/'; // Worker de Cloudflare que lee el título en nombre del navegador
            const nowPlayingFailures = new Map();
            const nowPlayingSkips = new Map();
            const proxyOnlyUrls = new Set(); // emisoras cuyo título solo se consigue a través del Worker
            let nowPlayingPoll = 0;
            const nowPlayingEl = document.getElementById('rmw-nowplaying');
            let nowPlayingTimer = null;
            let nowPlayingController = null;
            let lastNowPlayingAt = 0;
            let currentSong = '';

            function setNowPlaying(text) {
                if (text === currentSong) return;
                currentSong = text;
                nowPlayingEl.textContent = text;
                nowPlayingEl.title = text;
                nowPlayingEl.style.display = text ? 'block' : 'none';
                if (playingStation) updateMediaSession(playingStation);
            }

            // Al pulsar la canción se busca en YouTube: en el móvil se abre la app (vnd.youtube) y en el PC una pestaña nueva
            const songLink = document.getElementById('rmw-song') || nowPlayingEl;
            const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            function openSongOnYouTube() {
                if (!currentSong) return;
                const query = encodeURIComponent(currentSong);
                const webUrl = 'https://www.youtube.com/results?search_query=' + query;
                if (!isMobileDevice) {
                    window.open(webUrl, '_blank', 'noopener');
                    return;
                }
                // Móvil: se intenta abrir la app; si la página sigue a la vista, la app no está instalada y se abre el navegador
                const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                let appOpened = false;
                const markOpened = () => { appOpened = true; };
                const onVisibility = () => { if (document.visibilityState === 'hidden') appOpened = true; };
                document.addEventListener('visibilitychange', onVisibility);
                window.addEventListener('pagehide', markOpened);
                window.addEventListener('blur', markOpened);
                window.location.href = (isIOS ? 'youtube://' : 'vnd.youtube://') + 'results?search_query=' + query;
                setTimeout(() => {
                    document.removeEventListener('visibilitychange', onVisibility);
                    window.removeEventListener('pagehide', markOpened);
                    window.removeEventListener('blur', markOpened);
                    if (appOpened || document.visibilityState === 'hidden') return;
                    if (!window.open(webUrl, '_blank', 'noopener')) window.location.href = webUrl; // si el navegador bloquea la pestaña nueva
                }, 1500);
            }
            songLink.addEventListener('click', openSongOnYouTube);
            songLink.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSongOnYouTube(); }
            });

            function decodeIcyText(bytes) {
                try {
                    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
                } catch (_) {
                    return new TextDecoder('windows-1252').decode(bytes);
                }
            }

            function icyUrlFor(url) {
                // Una página https no puede pedir recursos http: se prueba la versión segura
                if (location.protocol === 'https:' && url.startsWith('http:')) return 'https:' + url.slice(5);
                return url;
            }

            // Devuelve el título (string, puede ser vacío), o null si este bloque no trae metadatos.
            // Lanza un error si la emisora no admite metadatos o el navegador no los deja leer.
            async function readIcyTitle(url, signal) {
                const response = await fetch(icyUrlFor(url), { headers: { 'Icy-MetaData': '1' }, cache: 'no-store', signal });
                const metaInt = parseInt(response.headers.get('icy-metaint'), 10);
                if (!response.ok || !metaInt || !response.body) throw new Error('sin metadatos');

                const reader = response.body.getReader();
                let buffer = new Uint8Array(0);
                const append = chunk => {
                    const merged = new Uint8Array(buffer.length + chunk.length);
                    merged.set(buffer);
                    merged.set(chunk, buffer.length);
                    buffer = merged;
                };

                try {
                    while (buffer.length < metaInt + 1) {
                        const { done, value } = await reader.read();
                        if (done) throw new Error('flujo cerrado');
                        append(value);
                    }
                    const metaLength = buffer[metaInt] * 16;
                    if (metaLength === 0) return null;

                    while (buffer.length < metaInt + 1 + metaLength) {
                        const { done, value } = await reader.read();
                        if (done) throw new Error('flujo cerrado');
                        append(value);
                    }
                    const text = decodeIcyText(buffer.slice(metaInt + 1, metaInt + 1 + metaLength));
                    const match = text.match(/StreamTitle='([\s\S]*?)';/) || text.match(/StreamTitle='([\s\S]*?)'/);
                    return match ? match[1].trim() : '';
                } finally {
                    reader.cancel().catch(() => {});
                }
            }

            // Pide el título al Worker (útil cuando la emisora no permite leerlo directamente desde el navegador)
            async function readIcyTitleViaProxy(url, signal) {
                const response = await fetch(`${ICY_PROXY_URL}?url=${encodeURIComponent(url)}`, { cache: 'no-store', signal });
                if (!response.ok) throw new Error('proxy no disponible');
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                return typeof data.title === 'string' ? data.title : null;
            }

            // Cada intento tiene su propio límite de 8 segundos
            async function withNowPlayingAttempt(read) {
                if (nowPlayingController) nowPlayingController.abort();
                const controller = new AbortController();
                nowPlayingController = controller;
                const timeout = setTimeout(() => controller.abort(), 8000);
                try {
                    return await read(controller.signal);
                } finally {
                    clearTimeout(timeout);
                }
            }

            async function pollNowPlaying() {
                if (!playingStation || !loadedUrl || audio.paused) return;
                const url = loadedUrl;

                // Tras varios fallos seguidos solo se reintenta de vez en cuando (1 de cada 6 consultas, aprox. cada minuto)
                if ((nowPlayingFailures.get(url) || 0) >= NOW_PLAYING_MAX_FAILURES) {
                    const skips = (nowPlayingSkips.get(url) || 0) + 1;
                    nowPlayingSkips.set(url, skips);
                    if (skips % 6 !== 0) return;
                }

                const myPoll = ++nowPlayingPoll;
                lastNowPlayingAt = Date.now();

                try {
                    let title;
                    if (proxyOnlyUrls.has(url)) {
                        title = await withNowPlayingAttempt(signal => readIcyTitleViaProxy(url, signal));
                    } else {
                        try {
                            title = await withNowPlayingAttempt(signal => readIcyTitle(url, signal));
                        } catch (_) {
                            if (myPoll !== nowPlayingPoll || url !== loadedUrl) return;
                            // La lectura directa ha fallado (normalmente por CORS): se prueba a través del Worker
                            title = await withNowPlayingAttempt(signal => readIcyTitleViaProxy(url, signal));
                            proxyOnlyUrls.add(url);
                        }
                    }
                    if (myPoll !== nowPlayingPoll || url !== loadedUrl) return;
                    nowPlayingFailures.set(url, 0);
                    nowPlayingSkips.set(url, 0);
                    if (title !== null) setNowPlaying(title);
                } catch (_) {
                    if (myPoll !== nowPlayingPoll || url !== loadedUrl) return; // sustituida por una consulta más reciente o emisora cambiada
                    nowPlayingFailures.set(url, (nowPlayingFailures.get(url) || 0) + 1);
                }
            }

            function stopNowPlaying() {
                nowPlayingPoll++; // descarta cualquier consulta en curso
                clearInterval(nowPlayingTimer);
                nowPlayingTimer = null;
                if (nowPlayingController) nowPlayingController.abort();
                nowPlayingController = null;
            }

            function startNowPlaying() {
                if (nowPlayingTimer) return;
                if (Date.now() - lastNowPlayingAt > 5000) pollNowPlaying();
                nowPlayingTimer = setInterval(pollNowPlaying, NOW_PLAYING_INTERVAL_MS);
            }

            function resetNowPlaying() {
                stopNowPlaying();
                lastNowPlayingAt = 0;
                setNowPlaying('');
            }

            audio.addEventListener('playing', () => {
                switchingStation = false;
                disarmAutoResume();
                if (corsRetryPending) {
                    if (corsRetryHost) corsBlockedHosts.add(corsRetryHost);
                    corsRetryPending = false;
                }
                setupRealAnalyser();
                miniStatus.textContent = (playingStation?.country || '') + ' · En reproducción';
                playPauseBtn.textContent = 'Ⅱ';
                miniPlayer.classList.add('is-playing');
                startDynamicVisualizer();
                startNowPlaying();
                refreshPlayButtons();
            });

            audio.addEventListener('pause', () => {
                const switching = switchingStation;
                switchingStation = false;
                if (audio.src && !switching) {
                    miniStatus.textContent = 'En pausa';
                    playPauseBtn.textContent = '▶';
                }
                miniPlayer.classList.remove('is-playing');
                stopDynamicVisualizer();
                stopNowPlaying();
                refreshPlayButtons();

                if (!userPaused) armAutoResume();
            });

            audio.addEventListener('waiting', () => { 
                miniStatus.textContent = 'Cargando audio…'; 
                miniPlayer.classList.remove('is-playing');
                resetBars();
            });
            
            audio.addEventListener('error', () => {
                if (audio.crossOrigin && audio.src) {
                    corsRetryPending = true;
                    corsRetryHost = hostOf(loadedUrl);
                    realAudio = false;
                    audio.removeAttribute('crossorigin');
                    audio.src = loadedUrl;
                    audio.load();
                    if (!userPaused) audio.play().catch(() => {});
                    return;
                }
                corsRetryPending = false;
                stopNowPlaying();
                miniStatus.textContent = 'Error de streaming. Prueba otra emisora.';
                playPauseBtn.textContent = '▶';
                miniPlayer.classList.remove('is-playing');
                stopDynamicVisualizer();
                refreshPlayButtons();
            });

            const hasMediaSession = 'mediaSession' in navigator;

            function updateMediaSession(station) {
                if (!hasMediaSession) return;
                try {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: currentSong || station.name,
                        artist: currentSong ? station.name : (station.country || 'Radio Forocochera'),
                        album: 'Radio Forocochera',
                        artwork: [
                            { src: ICON_URL, sizes: '96x96', type: 'image/png' },
                            { src: ICON_URL, sizes: '128x128', type: 'image/png' },
                            { src: ICON_URL, sizes: '192x192', type: 'image/png' },
                            { src: ICON_URL, sizes: '512x512', type: 'image/png' }
                        ]
                    });
                } catch (_) {}
            }

            if (hasMediaSession) {
                const setHandler = (action, handler) => {
                    try { navigator.mediaSession.setActionHandler(action, handler); } catch (_) {}
                };
                const pauseFromSystem = () => { userPaused = true; audio.pause(); };

                setHandler('play', async () => {
                    if (!audio.src) return;
                    userPaused = false;
                    try { await audio.play(); } catch (_) {}
                });
                setHandler('pause', pauseFromSystem);
                setHandler('stop', pauseFromSystem);

                audio.addEventListener('playing', () => { navigator.mediaSession.playbackState = 'playing'; });
                audio.addEventListener('pause', () => { navigator.mediaSession.playbackState = 'paused'; });
            }

            // Temporizador de Apagado
            const timerBtn = document.getElementById('rmw-timer');
            const timerMenu = document.createElement('div');
            timerMenu.id = 'rmw-timer-menu';
            document.body.appendChild(timerMenu);

            let sleepEnd = 0;
            let sleepTimeout = null;
            let sleepTick = null;

            function formatRemaining(ms) {
                const seconds = Math.max(0, Math.ceil(ms / 1000));
                return seconds >= 60 ? Math.ceil(seconds / 60) + 'm' : seconds + 's';
            }

            function updateTimerButton() {
                if (!sleepEnd) {
                    timerBtn.textContent = '⏱';
                    timerBtn.classList.remove('rmw-on');
                    timerBtn.title = 'Temporizador de apagado';
                    return;
                }
                const remaining = formatRemaining(sleepEnd - Date.now());
                timerBtn.textContent = remaining;
                timerBtn.classList.add('rmw-on');
                timerBtn.title = 'Se apagará en ' + remaining;
            }

            function cancelSleepTimer() {
                clearTimeout(sleepTimeout);
                clearInterval(sleepTick);
                sleepTimeout = null;
                sleepTick = null;
                sleepEnd = 0;
                updateTimerButton();
            }

            function finishSleepTimer() {
                cancelSleepTimer();
                userPaused = true;
                audio.pause();
            }

            function startSleepTimer(minutes) {
                if (isNaN(minutes) || minutes <= 0) return;
                cancelSleepTimer();
                const ms = minutes * 60000;
                sleepEnd = Date.now() + ms;
                sleepTimeout = setTimeout(finishSleepTimer, ms);
                sleepTick = setInterval(() => {
                    if (Date.now() >= sleepEnd) finishSleepTimer();
                    else updateTimerButton();
                }, 1000);
                updateTimerButton();
            }

            function renderTimerMenu() {
                timerMenu.innerHTML = `
                    <div class="rmw-timer-title">Apagar la radio en...</div>
                    <div style="display: flex; gap: 6px; margin-bottom: 8px;">
                        <input type="number" id="rmw-timer-num" min="1" value="30" style="width: 65px; padding: 6px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); text-align: center; font: inherit; outline: none;">
                        <select id="rmw-timer-unit" style="flex: 1; padding: 6px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); font: inherit; outline: none;">
                            <option value="min">Minutos</option>
                            <option value="hour">Horas</option>
                        </select>
                    </div>
                    <button type="button" id="rmw-timer-set" style="display: block; width: 100%; text-align: center; font: inherit; font-size: 12px; font-weight: 600; padding: 8px; border: 0; border-radius: 8px; cursor: pointer; color: #fff; background: var(--accent); margin-bottom: 6px;">Activar</button>
                    ${sleepEnd ? '<button type="button" id="rmw-timer-cancel" style="display: block; width: 100%; text-align: left; font: inherit; font-size: 12px; padding: 6px 8px; border: 0; border-radius: 8px; cursor: pointer; color: #ffb3b8; background: transparent;">Cancelar temporizador</button>' : ''}
                `;
            }

            function closeTimerMenu() {
                timerMenu.classList.remove('rmw-visible');
            }

            function openTimerMenu() {
                renderTimerMenu();
                const rect = timerBtn.getBoundingClientRect();
                const root = document.documentElement;
                timerMenu.style.right = Math.max(8, root.clientWidth - rect.right) + 'px';
                timerMenu.style.bottom = (root.clientHeight - rect.top + 8) + 'px';
                timerMenu.classList.add('rmw-visible');

                const setBtn = timerMenu.querySelector('#rmw-timer-set');
                const cancelBtn = timerMenu.querySelector('#rmw-timer-cancel');

                if (setBtn) {
                    setBtn.addEventListener('click', () => {
                        const num = Number(timerMenu.querySelector('#rmw-timer-num').value);
                        const unit = timerMenu.querySelector('#rmw-timer-unit').value;
                        const totalMinutes = unit === 'hour' ? num * 60 : num;
                        if (totalMinutes > 0) startSleepTimer(totalMinutes);
                        closeTimerMenu();
                    });
                }

                if (cancelBtn) {
                    cancelBtn.addEventListener('click', () => {
                        cancelSleepTimer();
                        closeTimerMenu();
                    });
                }
            }

            timerBtn.addEventListener('click', () => {
                if (timerMenu.classList.contains('rmw-visible')) closeTimerMenu();
                else openTimerMenu();
            });

            document.addEventListener('click', event => {
                if (!timerMenu.classList.contains('rmw-visible')) return;
                if (timerMenu.contains(event.target) || timerBtn.contains(event.target)) return;
                closeTimerMenu();
            });

            // Botones de Modo
            allButton.addEventListener('click', () => {
                if (currentMode === 'favorites') favoritesScrollLeft = results.scrollLeft;
                updateModeButtons('catalog');
                if (!restoreCatalogSnapshot()) loadStations(true);
            });
            favButton.addEventListener('click', () => {
                const comingFromCatalog = currentMode === 'catalog';
                renderFavorites();
                // Al volver a Favoritos desde el catálogo, se recupera la posición en que se dejó
                if (comingFromCatalog && favoritesScrollLeft !== null) {
                    const left = favoritesScrollLeft;
                    const restoreScroll = () => results.scrollTo({ left, behavior: 'instant' });
                    restoreScroll();
                    requestAnimationFrame(restoreScroll);
                }
            });

            function filtersChanged() {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => {
                    if (currentMode === 'favorites') renderFavorites();
                    else if (currentMode === 'catalog') loadStations(true);
                }, 350);
            }

            searchInput.addEventListener('input', filtersChanged);
            countrySelect.addEventListener('change', filtersChanged);
            genreSelect.addEventListener('change', filtersChanged);

            // Enlace compartido (?emisora=ID): carga y reproduce esa emisora en el reproductor
            // Pone la tarjeta de una emisora la primera de la lista, con un hueco vacío a la izquierda para que quede centrada en pantalla
            function showCardFirst(station) {
                results.querySelector('.rmw-shared-card')?.remove();
                results.querySelector('.rmw-shared-spacer')?.remove();
                // Si la emisora ya estaba en la lista, se quita esa para no duplicarla
                [...results.querySelectorAll('[data-play]')]
                    .find(b => b.getAttribute('data-play') === makeId(station))
                    ?.closest('.rmw-station')?.remove();

                const card = stationCard(station);
                card.classList.add('rmw-shared-card');

                const spacer = document.createElement('div');
                spacer.className = 'rmw-shared-spacer';
                spacer.style.cssText = 'flex: none; width: 0;';

                results.prepend(card);
                results.prepend(spacer);
                const cardCenter = card.offsetLeft - results.offsetLeft + card.offsetWidth / 2;
                spacer.style.width = Math.max(0, results.clientWidth / 2 - cardCenter) + 'px';
            }

            async function openSharedStation(listReady) {
                let params;
                try { params = new URLSearchParams(location.search); } catch (_) { return; }
                const id = params.get('emisora');
                const stream = params.get('stream');
                const validId = Boolean(id) && UUID_RE.test(id);
                const validStream = !validId && Boolean(stream) && /^https?:\/\//i.test(stream) && stream.length <= 2000;
                if (!validId && !validStream) return;
                try { history.replaceState(null, '', location.pathname + location.hash); } catch (_) {}

                try {
                    let station;
                    if (validId) {
                        const data = await apiFetch('/stations/byuuid/' + encodeURIComponent(id));
                        if (!Array.isArray(data) || !data[0]) throw new Error('emisora no encontrada');
                        station = normalizeStation(data[0]);
                    } else {
                        station = normalizeStation({
                            url: stream,
                            name: (params.get('nombre') || '').slice(0, 100),
                            country: (params.get('pais') || '').slice(0, 60)
                        });
                    }
                    const playback = playStation(station); // empieza a sonar sin esperar a la lista
                    // Cuando la lista está cargada, la emisora aparece la primera y sonando, para poder marcarla como favorita o compartirla
                    try { await listReady; } catch (_) {}
                    if (currentMode === 'catalog') {
                        showCardFirst(station);
                        results.scrollTo({ left: 0, behavior: 'smooth' });
                    }
                    await playback;
                    // Los navegadores suelen bloquear el sonido automático al abrir un enlace: la emisora queda cargada y basta pulsar play
                    if (playingStation && playingStation.id === station.id && audio.paused && !corsRetryPending) {
                        miniStatus.textContent = 'Pulsa play para escuchar';
                        playPauseBtn.textContent = '▶';
                    }
                } catch (_) {
                    miniStatus.textContent = 'No se pudo abrir la emisora compartida.';
                }
            }

            const countriesReady = loadCountries();
            if (!readCountriesCache()) await countriesReady; // con lista guardada no hace falta esperar a la API
            const listReady = loadStations(true);
            openSharedStation(listReady);
        })();
    </script>
    <script>
        // Navegación del cajón (solo interfaz; no toca la lógica de la radio)
        (() => {
            const track = document.getElementById('rmw-results');
            const prev = document.getElementById('crate-prev');
            const next = document.getElementById('crate-next');
            if (!track) return;
            const step = () => Math.max(260, track.clientWidth * 0.8);
            prev && prev.addEventListener('click', () => track.scrollBy({ left: -step(), behavior: 'smooth' }));
            next && next.addEventListener('click', () => track.scrollBy({ left: step(), behavior: 'smooth' }));

            // La rueda del ratón desplaza el cajón de lado
            track.addEventListener('wheel', e => {
                if (track.scrollWidth <= track.clientWidth) return;
                if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
                const atStart = track.scrollLeft <= 0 && e.deltaY < 0;
                const atEnd = track.scrollLeft + track.clientWidth >= track.scrollWidth - 1 && e.deltaY > 0;
                if (atStart || atEnd) return;
                track.scrollLeft += e.deltaY;
                e.preventDefault();
            }, { passive: false });

            // Nueva búsqueda: volver al principio
            // Quitar/poner una estrella no debe mover el cajón (en Favoritos la lista se redibuja)
            let keepScroll = false;
            document.addEventListener('click', e => {
                if (!e.target.closest('.rmw-star')) return;
                keepScroll = true;
                setTimeout(() => { keepScroll = false; }, 0);
            }, true);
            // El botón "Cargar más" no cuenta: al pulsarlo desaparece, pero eso no es una búsqueda nueva
            const countItems = () => Array.from(track.children).filter(c => c.id !== 'rmw-more').length;
            let lastCount = countItems();
            new MutationObserver(() => {
                const count = countItems();
                if (!keepScroll && count < lastCount) {
                    track.scrollTo({ left: 0, behavior: 'auto' });
                }
                lastCount = count;
            }).observe(track, { childList: true });

            // La emisora que suena se centra sola en el cajón
            const centerCard = card => {
                if (!card || !track.contains(card)) return;
                const t = track.getBoundingClientRect();
                const c = card.getBoundingClientRect();
                const left = track.scrollLeft + (c.left + c.width / 2) - (t.left + t.width / 2);
                track.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
            };
            let lastPlaying = null;
            new MutationObserver(() => {
                const playing = track.querySelector('.rmw-station.rmw-playing');
                if (playing && playing !== lastPlaying) centerCard(playing);
                lastPlaying = playing;
            }).observe(track, { subtree: true, attributes: true, attributeFilter: ['class'] });
            // Al entrar en Favoritos, la primera emisora queda centrada (el bloque Exportar/Importar queda a su izquierda)
            let pendingFavCenter = false;
            document.addEventListener('click', e => {
                if (e.target.closest('#rmw-favs')) pendingFavCenter = true;
            }, true);
            new MutationObserver(() => {
                if (!pendingFavCenter || !track.querySelector('#rmw-fav-manager')) return;
                pendingFavCenter = false;
                const first = track.querySelector('.rmw-station');
                if (!first) { track.scrollTo({ left: 0, behavior: 'auto' }); return; }
                const t = track.getBoundingClientRect();
                const c = first.getBoundingClientRect();
                track.scrollTo({ left: Math.max(0, track.scrollLeft + (c.left + c.width / 2) - (t.left + t.width / 2)), behavior: 'auto' });
            }).observe(track, { childList: true });
            // Al pulsar una emisora se centra enseguida, sin esperar a que cargue el audio
            track.addEventListener('click', e => {
                if (e.target.closest('[data-play]')) centerCard(e.target.closest('.rmw-station'));
            });
        })();
    </script>
    <script>
        // Animación de carga del reproductor (solo interfaz; no toca la lógica de la radio)
        (() => {
            const audio = document.getElementById('rmw-audio');
            const mini = document.getElementById('rmw-mini');
            if (!audio || !mini) return;
            const sync = () => {
                const loading = !audio.paused && !audio.error && !!audio.src && audio.readyState < 3;
                mini.classList.toggle('is-loading', loading);
            };
            ['play', 'loadstart', 'waiting', 'stalled', 'playing', 'canplay', 'pause', 'error', 'emptied']
                .forEach(ev => audio.addEventListener(ev, sync));
        })();
    </script>
