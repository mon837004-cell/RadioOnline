<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Forocochera - Directorio Mundial de Emisoras</title>
    <style>
      :root {
        --bg-main: #0c1220;
        --bg-card: #141f32;
        --bg-tools: #0f1727;
        --border-color: #273650;
        --accent: #3478df;
        --accent-hover: #438cff;
        --text-main: #edf2ff;
        --text-sub: #9baac4;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding-bottom: 90px;
      }

      header.rmw-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        background: #131d30;
        border-bottom: 1px solid #293650;
      }

      .rmw-brand {
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
      }

      .rmw-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: .3px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .rmw-title-icon {
        height: 34px;
        width: auto;
        flex: none;
        display: block;
      }

      .rmw-subtitle {
        margin-top: 3px;
        color: #8e9db8;
        font-size: 13px;
      }

      .rmw-tools {
        padding: 14px 20px;
        display: grid;
        gap: 10px;
        background: var(--bg-tools);
        border-bottom: 1px solid #293650;
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
      }

      .rmw-searchrow {
        display: flex;
        gap: 8px;
      }

      input, select {
        font: inherit;
        min-width: 0;
        width: 100%;
        padding: 11px;
        color: var(--text-main);
        background: #19253a;
        border: 1px solid #33425e;
        border-radius: 10px;
        outline: none;
      }

      input:focus, select:focus {
        border-color: #63a4ff;
      }

      .rmw-filterrow {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .rmw-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      .rmw-btn {
        border: 1px solid #344562;
        background: #1a2941;
        color: #dce8ff;
        border-radius: 9px;
        padding: 9px 13px;
        font-size: 13px;
      }

      .rmw-btn.active {
        color: white;
        background: #2759a5;
        border-color: #4688ee;
      }

      .rmw-container {
        flex: 1;
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
        padding: 15px 20px;
        display: flex;
        flex-direction: column;
      }

      #rmw-fav-manager {
        background: #141f33;
        border: 1px solid #283a5a;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .rmw-fav-info {
        font-weight: 600;
        color: #b0c4de;
      }

      .rmw-fav-btns {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .rmw-mgr-btn {
        border: 1px solid #3b4e70;
        background: #1d2d47;
        color: #e1ecff;
        padding: 7px 12px;
        border-radius: 8px;
        font-size: 13px;
      }
      .rmw-mgr-btn:hover { background: #283d5e; border-color: #5272a3; }

      .rmw-results {
        flex: 1;
        overflow-y: auto;
      }

      .rmw-status {
        color: var(--text-sub);
        padding: 15px 5px;
        line-height: 1.5;
      }

      .rmw-station {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        margin-bottom: 9px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 13px;
      }

      .rmw-station.rmw-playing {
        border-color: #438cff;
        background: #172944;
      }

      .rmw-logo {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 9px;
        background: #25334c;
        object-fit: contain;
      }

      .rmw-logo-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 21px;
      }

      .rmw-stationinfo {
        flex: 1;
        min-width: 0;
      }

      .rmw-stationname {
        font-weight: 700;
        color: #f1f5ff;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .rmw-meta {
        margin-top: 4px;
        color: #91a1bd;
        font-size: 11px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .rmw-play {
        flex: none;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: white;
        width: 41px;
        height: 41px;
        font-size: 18px;
      }

      .rmw-star {
        flex: none;
        border: 0;
        background: transparent;
        color: #a5b2c9;
        font-size: 23px;
        padding: 5px;
      }
      .rmw-star.is-fav { color: #ffd166; }

      .rmw-more {
        width: 100%;
        padding: 13px;
        margin: 10px 0 20px;
        border: 1px solid #334562;
        border-radius: 10px;
        color: #eaf1ff;
        background: #19263c;
      }

      /* Reproductor Mini Fijo Inferior */
      #rmw-mini {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        z-index: 1000;
        display: none;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        background: #111b2c;
        border-top: 1px solid #344563;
        box-shadow: 0 -4px 20px #0008;
      }
      #rmw-mini.rmw-visible { display: flex; }
      .rmw-miniinfo { flex: 1; min-width: 0; }
      .rmw-mininame { font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rmw-ministatus { margin-top: 3px; font-size: 11px; color: #9eafca; }
      .rmw-minibtn {
        flex: none; width: 38px; height: 38px; border: 0; border-radius: 9px;
        background: #263956; color: white; font-size: 17px;
      }
      .rmw-minibtn.rmw-on { background: #2759a5; font-size: 11px; font-weight: 700; }
      .rmw-volume { width: 90px; flex: none; accent-color: #5a9bff; }

      /* Toast Notification */
      #rmw-toast {
        position: fixed; z-index: 2147483002; left: 50%; bottom: 90px;
        transform: translateX(-50%); display: none;
        max-width: min(90vw, 420px); padding: 11px 16px;
        color: #f0f5ff; background: #111b2c; border: 1px solid #344563;
        border-radius: 12px; box-shadow: 0 4px 20px #0008;
        font: 14px/1.4 system-ui, -apple-system, sans-serif; text-align: center;
      }
      #rmw-toast.rmw-visible { display: block; }

      /* Temporizador Menu */
      #rmw-timer-menu {
        position: fixed; z-index: 2147483000; display: none;
        min-width: 190px; padding: 6px; color: #f0f5ff; background: #111b2c;
        border: 1px solid #344563; border-radius: 13px; box-shadow: 0 4px 20px #0008;
      }
      #rmw-timer-menu.rmw-visible { display: block; }
      #rmw-timer-menu .rmw-timer-title { padding: 6px 10px 8px; font-size: 11px; color: #9eafca; }
      #rmw-timer-menu button {
        display: block; width: 100%; text-align: left; font: inherit; font-size: 13px;
        padding: 9px 10px; border: 0; border-radius: 8px; cursor: pointer;
        color: #e1ecff; background: transparent;
      }
      #rmw-timer-menu button:hover { background: #263956; }
      #rmw-timer-menu button.rmw-sel { background: #2759a5; color: #fff; }
      #rmw-timer-menu button.rmw-off { color: #ffb3b8; }

      @media (min-width: 700px) {
        .rmw-container { padding: 20px; }
        #rmw-mini { max-width: 900px; left: 50%; transform: translateX(-50%); border-radius: 14px 14px 0 0; }
      }
    </style>
</head>
<body>

    <header class="rmw-header">
        <div class="rmw-brand">
            <div class="rmw-title">
                <span>Radio Forocochera</span>
                <img class="rmw-title-icon" src="https://raw.githubusercontent.com/mon837004-cell/RadioOnline/main/Icono.png" alt="Logo">
            </div>
            <div class="rmw-subtitle">Emisoras de todo el planeta</div>
        </div>
    </header>

    <div class="rmw-tools">
        <div class="rmw-searchrow">
            <input id="rmw-search" type="search" placeholder="Buscar emisora, ciudad o estilo…" autocomplete="off">
        </div>
        <div class="rmw-filterrow">
            <select id="rmw-country" aria-label="Filtrar por país">
                <option value="">🌐 Todos los países</option>
            </select>
            <select id="rmw-genre" aria-label="Filtrar por género">
                <option value="Todos los géneros">Todos los géneros</option>
                <option value="Rock">Rock</option><option value="Classic Rock">Classic Rock</option><option value="Hard Rock">Hard Rock</option>
                <option value="Metal">Metal</option><option value="Heavy Metal">Heavy Metal</option><option value="Pop">Pop</option>
                <option value="Dance">Dance</option><option value="Electronic">Electronic</option><option value="Techno">Techno</option>
                <option value="House">House</option><option value="Trance">Trance</option><option value="EDM">EDM</option>
                <option value="Disco">Disco</option><option value="80s">80s</option><option value="90s">90s</option>
                <option value="2000s">2000s</option><option value="Oldies">Oldies</option><option value="Classic Hits">Classic Hits</option>
                <option value="Hits">Hits</option><option value="Top 40">Top 40</option><option value="Alternative">Alternative</option>
                <option value="Indie">Indie</option><option value="Punk">Punk</option><option value="Jazz">Jazz</option>
                <option value="Blues">Blues</option><option value="Soul">Soul</option><option value="Funk">Funk</option>
                <option value="Reggae">Reggae</option><option value="Ska">Ska</option><option value="Hip Hop">Hip Hop</option>
                <option value="Rap">Rap</option><option value="R&B">R&B</option><option value="Latin">Latin</option>
                <option value="Salsa">Salsa</option><option value="Flamenco">Flamenco</option><option value="Classical">Classical</option>
                <option value="Opera">Opera</option><option value="Ambient">Ambient</option><option value="Chillout">Chillout</option>
                <option value="Lounge">Lounge</option><option value="Country">Country</option><option value="Folk">Folk</option>
                <option value="World Music">World Music</option><option value="Soundtracks">Soundtracks</option><option value="News">News</option>
                <option value="Talk">Talk</option><option value="Sports">Sports</option>
            </select>
        </div>
        <div class="rmw-actions">
            <button class="rmw-btn active" id="rmw-all">📚 Catálogo</button>
            <button class="rmw-btn" id="rmw-favs">⭐ Mis Favoritos</button>
            <button class="rmw-btn" id="rmw-refresh">↻ Actualizar</button>
        </div>
    </div>

    <div class="rmw-container">
        <div class="rmw-results" id="rmw-results" aria-live="polite">
            <div class="rmw-status">Conectando con el directorio mundial de emisoras…</div>
        </div>
    </div>

    <!-- Reproductor Mini Fijo -->
    <div id="rmw-mini">
        <div class="rmw-miniinfo">
            <div class="rmw-mininame" id="rmw-mininame">Radio Forocochera</div>
            <div class="rmw-ministatus" id="rmw-ministatus">Selecciona una emisora</div>
        </div>
        <button class="rmw-minibtn" id="rmw-playpause" title="Reproducir o pausar">▶</button>
        <button class="rmw-minibtn" id="rmw-timer" title="Temporizador de apagado" aria-label="Temporizador de apagado">⏱</button>
        <input class="rmw-volume" id="rmw-volume" type="range" min="0" max="1" step="0.05" aria-label="Volumen">
    </div>

    <audio id="rmw-audio" preload="none" playsinline></audio>
    <input type="file" id="rmw-file-input" accept=".json,application/json" style="display:none">
    <div id="rmw-toast" role="status" aria-live="polite"></div>

    <script>
        (() => {
            'use strict';

            const API_SERVERS = [
                'https://de1.api.radio-browser.info/json',
                'https://fr1.api.radio-browser.info/json',
                'https://at1.api.radio-browser.info/json'
            ];

            const ICON_URL = 'https://raw.githubusercontent.com/mon837004-cell/RadioOnline/main/Icono.png';
            const API_TIMEOUT_MS = 8000;

            const STORAGE = {
                favorites: 'rmw_favorites_v1',
                volume: 'rmw_volume_v1'
            };

            let apiIndex = 0;
            let favorites = loadGlobalFavorites();
            let playingStation = null;
            let showingFavorites = false;
            let searchTimer = null;
            let requestNumber = 0;
            let offset = 0;
            let loading = false;
            let currentQuery = {};
            let userPaused = false;
            let loadedUrl = '';
            let autoResumeArmed = false;
            let toastTimer = null;

            function sanitizeFavorites(list) {
                const seen = new Set();
                return (Array.isArray(list) ? list : [])
                    .filter(item => item && typeof item === 'object' && (item.url_resolved || item.url))
                    .map(normalizeStation)
                    .filter(item => {
                        if (!item.id || seen.has(item.id)) return false;
                        seen.add(item.id);
                        return true;
                    });
            }

            function loadGlobalFavorites() {
                try {
                    const localData = localStorage.getItem(STORAGE.favorites);
                    if (localData) {
                        const parsed = JSON.parse(localData);
                        if (Array.isArray(parsed) && parsed.length > 0) return sanitizeFavorites(parsed);
                    }
                    return [];
                } catch (_) {
                    return [];
                }
            }

            function saveFavorites() {
                try {
                    localStorage.setItem(STORAGE.favorites, JSON.stringify(favorites));
                } catch (_) {}
            }

            function esc(value) {
                return String(value ?? '').replace(/[&<>"']/g, c => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                })[c]);
            }

            function getVolume() {
                const value = Number(localStorage.getItem(STORAGE.volume) ?? 0.7);
                return Number.isFinite(value) && value >= 0 && value <= 1 ? value : 0.7;
            }

            function makeId(station) {
                return station.stationuuid || station.id || station.url_resolved || station.url;
            }

            function isFavorite(station) {
                return favorites.some(f => f.id === makeId(station));
            }

            function normalizeStation(station) {
                let favicon = station.favicon || '';
                if (favicon.startsWith('http://')) {
                    favicon = favicon.replace('http://', 'https://');
                }
                return {
                    id: makeId(station),
                    name: station.name || 'Emisora sin nombre',
                    url: station.url_resolved || station.url,
                    country: station.country || 'País desconocido',
                    countrycode: station.countrycode || '',
                    language: station.language || '',
                    tags: station.tags || '',
                    favicon: favicon,
                    codec: station.codec || '',
                    bitrate: station.bitrate || 0,
                    homepage: station.homepage || ''
                };
            }

            async function apiFetch(path) {
                let lastError;
                for (let i = 0; i < API_SERVERS.length; i++) {
                    const index = (apiIndex + i) % API_SERVERS.length;
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), API_TIMEOUT_MS);
                    try {
                        const response = await fetch(API_SERVERS[index] + path, { method: 'GET', cache: 'no-store', signal: controller.signal });
                        if (!response.ok) throw new Error('HTTP ' + response.status);
                        apiIndex = index;
                        return await response.json();
                    } catch (error) {
                        lastError = error;
                    } finally {
                        clearTimeout(timer);
                    }
                }
                throw lastError || new Error('No se pudo conectar al catálogo');
            }

            const results = document.getElementById('rmw-results');
            const searchInput = document.getElementById('rmw-search');
            const countrySelect = document.getElementById('rmw-country');
            const genreSelect = document.getElementById('rmw-genre');
            const allButton = document.getElementById('rmw-all');
            const favButton = document.getElementById('rmw-favs');
            const fileInput = document.getElementById('rmw-file-input');
            const audio = document.getElementById('rmw-audio');
            const toast = document.getElementById('rmw-toast');

            audio.volume = getVolume();

            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('rmw-visible');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('rmw-visible'), 4000);
            }

            async function loadCountries() {
                try {
                    const countries = await apiFetch('/countries?order=stationcount&reverse=true');
                    if (!Array.isArray(countries)) return;

                    const current = countrySelect.value;
                    countrySelect.innerHTML =
                        '<option value="">🌐 Todos los países</option>' +
                        countries
                            .filter(c => c && c.name && Number(c.stationcount) > 0)
                            .map(c => `<option value="${esc(c.name)}">${esc(c.name)} (${Number(c.stationcount)})</option>`)
                            .join('');

                    if ([...countrySelect.options].some(o => o.value === current)) {
                        countrySelect.value = current;
                    }
                } catch (_) {}
            }

            function setStatus(message) {
                results.innerHTML = `<div class="rmw-status">${esc(message)}</div>`;
            }

            function updateModeButtons() {
                allButton.classList.toggle('active', !showingFavorites);
                favButton.classList.toggle('active', showingFavorites);
            }

            function getFilters() {
                return {
                    name: searchInput.value.trim(),
                    country: countrySelect.value,
                    genre: genreSelect.value === 'Todos los géneros' ? '' : genreSelect.value
                };
            }

            async function loadStations(reset = false) {
                if (showingFavorites) {
                    renderFavorites();
                    return;
                }

                if (loading && !reset) return;

                if (reset) {
                    offset = 0;
                    currentQuery = getFilters();
                    requestNumber++;
                    results.innerHTML = '';
                }

                const myRequest = requestNumber;
                loading = true;

                if (reset) setStatus('Buscando emisoras…');

                try {
                    const filters = currentQuery;
                    const params = new URLSearchParams();
                    params.set('limit', '50');
                    params.set('offset', String(offset));
                    params.set('hidebroken', 'true');
                    params.set('order', 'clickcount');
                    params.set('reverse', 'true');

                    if (filters.name) params.set('name', filters.name);
                    if (filters.country) params.set('country', filters.country);
                    if (filters.genre) params.set('tag', filters.genre.toLowerCase());

                    const data = await apiFetch('/stations/search?' + params.toString());

                    if (myRequest !== requestNumber || !Array.isArray(data)) return;

                    const stations = data
                        .filter(s => s && (s.url_resolved || s.url) && s.stationuuid)
                        .map(normalizeStation);

                    offset += data.length;
                    renderStations(stations, reset, data.length >= 50);

                    if (reset && stations.length === 0) {
                        setStatus('No se han encontrado emisoras. Prueba con otro país, género o búsqueda.');
                    } else if (reset && stations.length > 0) {
                        const count = document.createElement('div');
                        count.className = 'rmw-status';
                        count.textContent = 'Mostrando emisoras encontradas. Puedes cargar más al final.';
                        results.prepend(count);
                    }
                } catch (_) {
                    if (myRequest === requestNumber) {
                        setStatus('No se pudo conectar al directorio. Comprueba la conexión y pulsa «Actualizar».');
                    }
                } finally {
                    if (myRequest === requestNumber) loading = false;
                }
            }

            function stationCard(station) {
                const stationId = makeId(station);
                const id = esc(stationId);
                const active = playingStation && playingStation.id === stationId;
                const favorite = isFavorite(station);
                const tags = station.tags ? station.tags.split(',').slice(0, 4).join(' · ') : 'Sin etiquetas';

                const card = document.createElement('div');
                card.className = 'rmw-station' + (active ? ' rmw-playing' : '');
                
                let logoHtml = `<div class="rmw-logo rmw-logo-placeholder">📻</div>`;
                if (station.favicon) {
                    logoHtml = `<img class="rmw-logo" loading="lazy" alt="" src="${esc(station.favicon)}">`;
                }

                card.innerHTML = `
                  ${logoHtml}
                  <div class="rmw-stationinfo">
                    <div class="rmw-stationname">${esc(station.name)}</div>
                    <div class="rmw-meta">
                      🌍 ${esc(station.country)}
                      ${station.bitrate ? ' · ' + Number(station.bitrate) + ' kbps' : ''}
                      ${station.codec ? ' · ' + esc(station.codec) : ''}
                      <br>${esc(tags)}
                    </div>
                  </div>
                  <button class="rmw-star ${favorite ? 'is-fav' : ''}" data-favorite="${id}" title="${favorite ? 'Quitar de favoritos' : 'Añadir a favoritos'}">
                    ${favorite ? '★' : '☆'}
                  </button>
                  <button class="rmw-play" data-play="${id}" title="Reproducir">${active && !audio.paused ? 'Ⅱ' : '▶'}</button>
                `;

                const logoImg = card.querySelector('img.rmw-logo');
                if (logoImg) {
                    logoImg.addEventListener('error', () => {
                        const placeholder = document.createElement('div');
                        placeholder.className = 'rmw-logo rmw-logo-placeholder';
                        placeholder.textContent = '📻';
                        logoImg.replaceWith(placeholder);
                    });
                }

                card.querySelector('[data-play]').addEventListener('click', () => {
                    const isActive = playingStation && playingStation.id === stationId;
                    if (isActive && !audio.paused) {
                        userPaused = true;
                        audio.pause();
                    } else if (isActive && audio.paused) {
                        userPaused = false;
                        audio.play().catch(() => {});
                    } else {
                        userPaused = false;
                        playStation(station);
                    }
                    refreshPlayButtons();
                });

                card.querySelector('[data-favorite]').addEventListener('click', () => {
                    toggleFavorite(station);
                    const button = card.querySelector('[data-favorite]');
                    const nowFavorite = isFavorite(station);
                    button.classList.toggle('is-fav', nowFavorite);
                    button.textContent = nowFavorite ? '★' : '☆';
                    if (showingFavorites) {
                        const top = results.scrollTop;
                        renderFavorites();
                        results.scrollTop = top;
                    }
                });

                return card;
            }

            function renderStations(stations, reset, hasMore = stations.length >= 50) {
                if (reset) results.innerHTML = '';
                stations.forEach(station => results.appendChild(stationCard(station)));

                const oldMore = document.getElementById('rmw-more');
                if (oldMore) oldMore.remove();

                if (hasMore) {
                    const more = document.createElement('button');
                    more.id = 'rmw-more';
                    more.className = 'rmw-more';
                    more.textContent = 'Cargar más emisoras ↓';
                    more.addEventListener('click', () => {
                        more.remove();
                        loadStations(false);
                    });
                    results.appendChild(more);
                }
            }

            function renderFavorites() {
                results.innerHTML = '';

                const manager = document.createElement('div');
                manager.id = 'rmw-fav-manager';
                manager.innerHTML = `
                  <div class="rmw-fav-info">⭐ Guardadas: ${favorites.length} emisoras</div>
                  <div class="rmw-fav-btns">
                    <button class="rmw-mgr-btn" id="rmw-export-file" title="Descargar archivo JSON con tu lista">📥 Exportar Favoritos</button>
                    <button class="rmw-mgr-btn" id="rmw-import-file" title="Cargar archivo JSON desde tu equipo">📤 Importar Favoritos</button>
                  </div>
                `;

                results.appendChild(manager);

                manager.querySelector('#rmw-export-file').addEventListener('click', exportFavoritesFile);
                manager.querySelector('#rmw-import-file').addEventListener('click', () => fileInput.click());

                if (!favorites.length) {
                    const emptyMsg = document.createElement('div');
                    emptyMsg.className = 'rmw-status';
                    emptyMsg.textContent = 'No tienes emisoras guardadas. Marca ★ en cualquier radio o usa "Importar Favoritos" para restaurar una copia de seguridad.';
                    results.appendChild(emptyMsg);
                    return;
                }

                const query = searchInput.value.trim().toLowerCase();
                const country = countrySelect.value;
                const genre = genreSelect.value === 'Todos los géneros' ? '' : genreSelect.value.toLowerCase();

                const list = favorites.filter(station => {
                    const matchesQuery = !query || (station.name + ' ' + station.country + ' ' + station.tags).toLowerCase().includes(query);
                    const matchesCountry = !country || station.country === country;
                    const matchesGenre = !genre || (station.tags || '').toLowerCase().includes(genre);
                    return matchesQuery && matchesCountry && matchesGenre;
                });

                if (!list.length) {
                    const noMatchMsg = document.createElement('div');
                    noMatchMsg.className = 'rmw-status';
                    noMatchMsg.textContent = 'No hay favoritos que coincidan con estos filtros.';
                    results.appendChild(noMatchMsg);
                    return;
                }

                list.forEach(station => results.appendChild(stationCard(station)));
            }

            function toggleFavorite(station) {
                const id = makeId(station);
                if (isFavorite(station)) {
                    favorites = favorites.filter(f => f.id !== id);
                } else {
                    favorites.push({
                        id,
                        name: station.name,
                        url: station.url,
                        country: station.country,
                        countrycode: station.countrycode,
                        language: station.language,
                        tags: station.tags,
                        favicon: station.favicon,
                        codec: station.codec,
                        bitrate: station.bitrate,
                        homepage: station.homepage
                    });
                }
                saveFavorites();
            }

            function exportFavoritesFile() {
                if (!favorites.length) {
                    showToast('No tienes ningún favorito para exportar.');
                    return;
                }
                const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(favorites, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute('href', dataStr);
                downloadAnchor.setAttribute('download', 'mis_emisoras_favoritas.json');
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            }

            fileInput.addEventListener('change', event => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const imported = sanitizeFavorites(JSON.parse(e.target.result));
                        if (imported.length > 0) {
                            favorites = imported;
                            saveFavorites();
                            showToast(`¡Éxito! Se han cargado ${imported.length} emisoras desde el archivo.`);
                            if (showingFavorites) renderFavorites();
                        } else {
                            showToast('El archivo JSON no contiene una lista válida de emisoras.');
                        }
                    } catch (_) {
                        showToast('Error al leer el archivo. Asegúrate de que sea un JSON válido.');
                    }
                    fileInput.value = '';
                };
                reader.readAsText(file);
            });

            async function playStation(station) {
                userPaused = false;
                const normalized = normalizeStation(station);
                playingStation = normalized;
                updateMediaSession(normalized);
                document.getElementById('rmw-mini').classList.add('rmw-visible');
                document.getElementById('rmw-mininame').textContent = normalized.name;
                document.getElementById('rmw-ministatus').textContent = 'Conectando…';
                document.getElementById('rmw-playpause').textContent = 'Ⅱ';

                if (loadedUrl !== normalized.url || !audio.src) {
                    audio.pause();
                    audio.src = normalized.url;
                    loadedUrl = normalized.url;
                    audio.load();
                }

                try {
                    await audio.play();
                    document.getElementById('rmw-ministatus').textContent = normalized.country + ' · En reproducción';
                } catch (_) {
                    document.getElementById('rmw-ministatus').textContent = 'No se pudo reproducir. Prueba otra emisora.';
                    document.getElementById('rmw-playpause').textContent = '▶';
                }

                refreshPlayButtons();
            }

            function refreshPlayButtons() {
                document.querySelectorAll('[data-play]').forEach(button => {
                    const btnId = button.getAttribute('data-play');
                    const active = playingStation && playingStation.id === btnId;
                    button.textContent = active && !audio.paused ? 'Ⅱ' : '▶';
                    button.closest('.rmw-station')?.classList.toggle('rmw-playing', Boolean(active));
                });
            }

            document.getElementById('rmw-playpause').addEventListener('click', async () => {
                if (!audio.src) return;
                if (audio.paused) {
                    userPaused = false;
                    try { await audio.play(); } catch (_) { document.getElementById('rmw-ministatus').textContent = 'No se pudo reanudar la emisora.'; }
                } else {
                    userPaused = true;
                    audio.pause();
                }
            });

            const volRange = document.getElementById('rmw-volume');
            volRange.value = String(audio.volume);
            volRange.addEventListener('input', event => {
                audio.volume = Number(event.target.value);
                localStorage.setItem(STORAGE.volume, String(audio.volume));
            });

            async function tryAutoResume() {
                if (userPaused) { disarmAutoResume(); return; }
                if (!audio.paused || !audio.src) return;
                try {
                    await audio.play();
                    disarmAutoResume();
                } catch (_) {}
            }

            function onVisibilityResume() {
                if (document.visibilityState === 'visible') tryAutoResume();
            }

            function armAutoResume() {
                if (autoResumeArmed) return;
                autoResumeArmed = true;
                window.addEventListener('focus', tryAutoResume);
                window.addEventListener('click', tryAutoResume);
                document.addEventListener('visibilitychange', onVisibilityResume);
            }

            function disarmAutoResume() {
                if (!autoResumeArmed) return;
                autoResumeArmed = false;
                window.removeEventListener('focus', tryAutoResume);
                window.removeEventListener('click', tryAutoResume);
                document.removeEventListener('visibilitychange', onVisibilityResume);
            }

            audio.addEventListener('playing', () => {
                disarmAutoResume();
                document.getElementById('rmw-ministatus').textContent = (playingStation?.country || '') + ' · En reproducción';
                document.getElementById('rmw-playpause').textContent = 'Ⅱ';
                refreshPlayButtons();
            });

            audio.addEventListener('pause', () => {
                if (audio.src) {
                    document.getElementById('rmw-ministatus').textContent = 'En pausa';
                    document.getElementById('rmw-playpause').textContent = '▶';
                }
                refreshPlayButtons();

                if (!userPaused) armAutoResume();
            });

            audio.addEventListener('waiting', () => { document.getElementById('rmw-ministatus').textContent = 'Cargando audio…'; });
            audio.addEventListener('error', () => {
                document.getElementById('rmw-ministatus').textContent = 'Error de streaming. Prueba otra emisora.';
                document.getElementById('rmw-playpause').textContent = '▶';
                refreshPlayButtons();
            });

            // Media Session API Support
            const hasMediaSession = 'mediaSession' in navigator;

            function updateMediaSession(station) {
                if (!hasMediaSession) return;
                try {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: station.name,
                        artist: station.country || 'Radio Forocochera',
                        album: 'Radio Forocochera',
                        artwork: [{ src: ICON_URL, sizes: '447x440', type: 'image/png' }]
                    });
                } catch (_) {}
            }

            if (hasMediaSession) {
                const setHandler = (action, handler) => {
                    try { navigator.mediaSession.setActionHandler(action, handler); } catch (_) {}
                };
                const pauseFromSystem = () => { userPaused = true; audio.pause(); };

                setHandler('play', async () => {
                    if (!audio.src) return;
                    userPaused = false;
                    try { await audio.play(); } catch (_) {}
                });
                setHandler('pause', pauseFromSystem);
                setHandler('stop', pauseFromSystem);

                audio.addEventListener('playing', () => { navigator.mediaSession.playbackState = 'playing'; });
                audio.addEventListener('pause', () => { navigator.mediaSession.playbackState = 'paused'; });
            }

            // Temporizador de Apagado
            const TIMER_OPTIONS = [15, 30, 45, 60, 90];
            const timerBtn = document.getElementById('rmw-timer');
            const timerMenu = document.createElement('div');
            timerMenu.id = 'rmw-timer-menu';
            document.body.appendChild(timerMenu);

            let sleepEnd = 0;
            let sleepMinutes = 0;
            let sleepTimeout = null;
            let sleepTick = null;

            function formatRemaining(ms) {
                const seconds = Math.max(0, Math.ceil(ms / 1000));
                return seconds >= 60 ? Math.ceil(seconds / 60) + 'm' : seconds + 's';
            }

            function updateTimerButton() {
                if (!sleepEnd) {
                    timerBtn.textContent = '⏱';
                    timerBtn.classList.remove('rmw-on');
                    timerBtn.title = 'Temporizador de apagado';
                    return;
                }
                const remaining = formatRemaining(sleepEnd - Date.now());
                timerBtn.textContent = remaining;
                timerBtn.classList.add('rmw-on');
                timerBtn.title = 'Se apagará en ' + remaining;
            }

            function cancelSleepTimer() {
                clearTimeout(sleepTimeout);
                clearInterval(sleepTick);
                sleepTimeout = null;
                sleepTick = null;
                sleepEnd = 0;
                sleepMinutes = 0;
                updateTimerButton();
            }

            function finishSleepTimer() {
                cancelSleepTimer();
                userPaused = true;
                audio.pause();
            }

            function startSleepTimer(minutes) {
                cancelSleepTimer();
                sleepMinutes = minutes;
                sleepEnd = Date.now() + minutes * 60000;
                sleepTimeout = setTimeout(finishSleepTimer, minutes * 60000);
                sleepTick = setInterval(() => {
                    if (Date.now() >= sleepEnd) finishSleepTimer();
                    else updateTimerButton();
                }, 1000);
                updateTimerButton();
            }

            function renderTimerMenu() {
                timerMenu.innerHTML =
                    '<div class="rmw-timer-title">Apagar la radio en…</div>' +
                    TIMER_OPTIONS.map(min =>
                        `<button type="button" data-min="${min}" class="${sleepMinutes === min ? 'rmw-sel' : ''}">${min} minutos</button>`
                    ).join('') +
                    (sleepEnd ? '<button type="button" data-min="0" class="rmw-off">Cancelar temporizador</button>' : '');
            }

            function closeTimerMenu() {
                timerMenu.classList.remove('rmw-visible');
            }

            function openTimerMenu() {
                renderTimerMenu();
                const rect = timerBtn.getBoundingClientRect();
                const root = document.documentElement;
                timerMenu.style.right = Math.max(8, root.clientWidth - rect.right) + 'px';
                timerMenu.style.bottom = (root.clientHeight - rect.top + 8) + 'px';
                timerMenu.classList.add('rmw-visible');
            }

            timerBtn.addEventListener('click', () => {
                if (timerMenu.classList.contains('rmw-visible')) closeTimerMenu();
                else openTimerMenu();
            });

            timerMenu.addEventListener('click', event => {
                const option = event.target.closest('button[data-min]');
                if (!option) return;
                const minutes = Number(option.getAttribute('data-min'));
                if (minutes > 0) startSleepTimer(minutes);
                else cancelSleepTimer();
                closeTimerMenu();
            });

            document.addEventListener('click', event => {
                if (!timerMenu.classList.contains('rmw-visible')) return;
                if (timerMenu.contains(event.target) || timerBtn.contains(event.target)) return;
                closeTimerMenu();
            });

            // Controles Principales
            allButton.addEventListener('click', () => { showingFavorites = false; updateModeButtons(); loadStations(true); });
            favButton.addEventListener('click', () => { showingFavorites = true; updateModeButtons(); renderFavorites(); });

            function filtersChanged() {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => {
                    if (showingFavorites) renderFavorites();
                    else loadStations(true);
                }, 350);
            }

            searchInput.addEventListener('input', filtersChanged);
            countrySelect.addEventListener('change', filtersChanged);
            genreSelect.addEventListener('change', filtersChanged);

            document.getElementById('rmw-refresh').addEventListener('click', async () => {
                if (showingFavorites) renderFavorites();
                else await loadStations(true);
                loadCountries();
            });

            loadCountries();
            loadStations(true);
        })();
    </script>
</body>
</html>
